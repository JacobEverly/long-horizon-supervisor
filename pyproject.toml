[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "long-horizon-supervisor"
version = "0.1.0"
description = "A completion-first model scheduler for long-running coding agents"
readme = "README.md"
license = "MIT"
authors = [{ name = "Jacob Everly" }]
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8,<3",
  "verifiers==0.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]
eval = [
  "harbor[daytona]==0.21.0",
  "nemo-switchyard[cli,server]==0.2.0",
]
data = [
  "huggingface-hub>=1.0,<2",
  "pyarrow>=17,<26",
]
training = [
  "scikit-learn>=1.5,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["artifacts", "benchmark_tasks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[project.scripts]
horizon-benchmark = "horizon_supervisor.benchmark.cli:main"

[project.urls]
Repository = "https://github.com/JacobEverly/long-horizon-supervisor"
Documentation = "https://github.com/JacobEverly/long-horizon-supervisor#readme"
