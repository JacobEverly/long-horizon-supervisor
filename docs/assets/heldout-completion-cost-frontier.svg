<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Verified completion versus replayed model cost</title>
  <desc id="desc">A verifier-gated model cascade increases verified completion from six of eighteen tasks with Flash alone to twelve of eighteen tasks with four models. The two-model Flash to Qwen cascade completes nine tasks. Kimi alone completes seven tasks at a higher replayed cost than the four-model cascade.</desc>
  <rect width="1000" height="620" rx="24" fill="#0b1220"/>
  <text x="70" y="64" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700">Completion-first routing exposes a useful cost frontier</text>
  <text x="70" y="98" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">18 sealed Terminal-Bench Pro tasks · stop after verifier-confirmed success</text>

  <line x1="112" y1="500" x2="910" y2="500" stroke="#475569" stroke-width="2"/>
  <line x1="112" y1="140" x2="112" y2="500" stroke="#475569" stroke-width="2"/>

  <g fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">
    <text x="106" y="525">$0</text>
    <text x="296" y="525">$1</text>
    <text x="486" y="525">$2</text>
    <text x="676" y="525">$3</text>
    <text x="866" y="525">$4</text>
    <text x="64" y="505">30%</text>
    <text x="64" y="415">40%</text>
    <text x="64" y="325">50%</text>
    <text x="64" y="235">60%</text>
    <text x="64" y="145">70%</text>
    <text x="430" y="570" font-size="16">Replayed model cost</text>
    <text x="26" y="365" font-size="16" transform="rotate(-90 26 365)">Verified completion</text>
  </g>

  <g stroke="#263449" stroke-width="1">
    <line x1="112" y1="410" x2="910" y2="410"/>
    <line x1="112" y1="320" x2="910" y2="320"/>
    <line x1="112" y1="230" x2="910" y2="230"/>
    <line x1="112" y1="140" x2="910" y2="140"/>
  </g>

  <polyline points="135,470 325,320 563,270 843,170" fill="none" stroke="#38d9a9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <circle cx="135" cy="470" r="9" fill="#38d9a9"/>
    <text x="150" y="459" fill="#f8fafc" font-size="16" font-weight="650">Flash</text>
    <text x="150" y="480" fill="#94a3b8" font-size="14">6/18 · $0.12</text>

    <circle cx="325" cy="320" r="9" fill="#38d9a9"/>
    <text x="340" y="301" fill="#f8fafc" font-size="16" font-weight="650">Flash → Qwen</text>
    <text x="340" y="322" fill="#94a3b8" font-size="14">9/18 · $1.12</text>

    <circle cx="563" cy="270" r="9" fill="#38d9a9"/>
    <text x="578" y="251" fill="#f8fafc" font-size="16" font-weight="650">+ GLM</text>
    <text x="578" y="272" fill="#94a3b8" font-size="14">10/18 · $2.37</text>

    <circle cx="843" cy="170" r="11" fill="#38d9a9"/>
    <text x="895" y="153" text-anchor="end" fill="#f8fafc" font-size="16" font-weight="700">+ Kimi: completion-first</text>
    <text x="895" y="184" text-anchor="end" fill="#94a3b8" font-size="14">12/18 · $3.85</text>

    <circle cx="883" cy="420" r="9" fill="#0b1220" stroke="#fb7185" stroke-width="4"/>
    <text x="895" y="406" text-anchor="end" fill="#f8fafc" font-size="16" font-weight="650">Kimi alone</text>
    <text x="895" y="428" text-anchor="end" fill="#94a3b8" font-size="14">7/18 · $4.06</text>
  </g>

  <rect x="112" y="112" width="798" height="1" fill="#263449"/>
  <text x="70" y="602" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">Costs replay the exact observed attempts using comparable catalog prices; they are not the provider invoice.</text>
</svg>
