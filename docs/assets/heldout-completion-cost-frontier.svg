<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Verified completion versus replayed model cost</title>
  <desc id="desc">On eighteen sealed tasks, a verifier-gated portfolio rises from six completions with Flash alone to twelve with four models at 3 dollars and 85 cents. Kimi alone completes seven tasks at 4 dollars and 6 cents.</desc>

  <rect width="960" height="540" fill="#fbfaf7"/>

  <g font-family="IBM Plex Sans, Helvetica Neue, sans-serif">
    <text x="72" y="48" fill="#17212b" font-size="24" font-weight="600">Verified completion improves along the model portfolio</text>
    <text x="72" y="76" fill="#66717d" font-size="14">18 sealed tasks · each route stops after external verification</text>

    <g stroke="#d9dde1" stroke-width="1">
      <line x1="104" y1="432" x2="888" y2="432"/>
      <line x1="104" y1="354" x2="888" y2="354"/>
      <line x1="104" y1="276" x2="888" y2="276"/>
      <line x1="104" y1="198" x2="888" y2="198"/>
      <line x1="104" y1="120" x2="888" y2="120"/>
    </g>

    <g stroke="#89939d" stroke-width="1.5">
      <line x1="104" y1="120" x2="104" y2="432"/>
      <line x1="104" y1="432" x2="888" y2="432"/>
    </g>

    <g fill="#66717d" font-size="13">
      <text x="83" y="436" text-anchor="end">0%</text>
      <text x="83" y="358" text-anchor="end">17%</text>
      <text x="83" y="280" text-anchor="end">33%</text>
      <text x="83" y="202" text-anchor="end">50%</text>
      <text x="83" y="124" text-anchor="end">67%</text>

      <text x="104" y="457" text-anchor="middle">$0</text>
      <text x="296" y="457" text-anchor="middle">$1</text>
      <text x="488" y="457" text-anchor="middle">$2</text>
      <text x="680" y="457" text-anchor="middle">$3</text>
      <text x="872" y="457" text-anchor="middle">$4</text>

      <text x="496" y="496" text-anchor="middle" font-size="14">Replayed model cost (USD)</text>
      <text x="27" y="276" text-anchor="middle" font-size="14" transform="rotate(-90 27 276)">Verified completion</text>
    </g>

    <path d="M127 276 L319 198 L559 172 L843 120" fill="none" stroke="#1769aa" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <g fill="#1769aa">
      <circle cx="127" cy="276" r="6"/>
      <circle cx="319" cy="198" r="6"/>
      <circle cx="559" cy="172" r="6"/>
      <circle cx="843" cy="120" r="7"/>
    </g>

    <g fill="#17212b" font-size="14">
      <text x="140" y="262" font-weight="600">Flash</text>
      <text x="140" y="282" fill="#66717d">6/18 · $0.12</text>

      <text x="332" y="184" font-weight="600">+ Qwen</text>
      <text x="332" y="204" fill="#66717d">9/18 · $1.12</text>

      <text x="572" y="158" font-weight="600">+ GLM</text>
      <text x="572" y="178" fill="#66717d">10/18 · $2.37</text>

      <text x="830" y="105" text-anchor="end" font-weight="600">+ Kimi</text>
      <text x="830" y="136" text-anchor="end" fill="#66717d">12/18 · $3.85</text>
    </g>

    <circle cx="884" cy="250" r="7" fill="#fbfaf7" stroke="#a65c3a" stroke-width="3"/>
    <text x="867" y="238" text-anchor="end" fill="#17212b" font-size="14" font-weight="600">Kimi alone</text>
    <text x="867" y="259" text-anchor="end" fill="#66717d" font-size="14">7/18 · $4.06</text>

    <g font-size="12">
      <line x1="664" y1="92" x2="706" y2="92" stroke="#1769aa" stroke-width="3"/>
      <text x="716" y="96" fill="#66717d">Verifier-gated portfolio frontier</text>
    </g>

    <text x="72" y="524" fill="#7a838c" font-size="11">Costs replay observed attempts at comparable catalog prices; they are not the provider invoice.</text>
  </g>
</svg>
